name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # the library is standard-library only, so no torch/ultralytics here
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=evaltrack_gate --cov-report=term-missing --cov-fail-under=90
