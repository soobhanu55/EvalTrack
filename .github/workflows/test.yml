name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # regression logic has no heavy deps, so skip ultralytics/torch here
      - run: pip install -e . pytest pytest-cov
      - run: pytest -q --cov=evaltrack --cov-report=term-missing --cov-fail-under=90
